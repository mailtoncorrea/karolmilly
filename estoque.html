<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Produtos - Karol Milly</title>
    <link rel="stylesheet" href="./static/css/estoque.css" />
  </head>
  <body>
    <div class="header_md">
      <h1 class="header_ger_stoque">📦 Gerenciador de Estoque</h1>
      <div class="space_btn">
        <button onclick="irParaVendas()" class="btn_vendas">
          🛍️ Vendas
        </button>
        <button onclick="irParaRelatorios()" class="btn_relatorios">
          📊 Relatórios
        </button>
        <button onclick="logout()">Sair</button>
      </div>
    </div>
    
    </div>

    <script>
      function irParaRelatorio() {
        window.location.href = "relatorio.html";
      }
    </script>

    <div class="">
      <h2>Buscar Produto</h2>
      <div class="form-group">
        <input
          type="text"
          id="buscaNome"
          placeholder="Digite o nome do produto"
        />
        <button onclick="buscarProduto()">Buscar Produto</button>
      </div>

      <div id="resultadoBusca"></div>
    </div>
    <h1>Cadastro de Produtos</h1>

    <div class="form-group">
      <div>
        <label for="nome">Nome do Produto:</label><br />
        <input type="text" id="nome" />
      </div>

      <div>
        <label for="preco">Preço:</label><br />
        <input type="number" id="preco" step="0.01" />
      </div>

      <div>
        <label for="estoque">Estoque:</label><br />
        <input type="number" id="estoque" />
      </div>

      <div style="align-self: flex-end">
        <button onclick="cadastrarProduto()">Cadastrar Produto</button>
      </div>
    </div>

    <h2>Lista de Produtos</h2>
    <button onclick="carregarProdutos()">Atualizar Lista</button>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Preço</th>
          <th>Estoque</th>
        </tr>
      </thead>
      <tbody id="tabelaProdutos">
        <!-- Produtos serão inseridos aqui -->
      </tbody>
    </table>

    <script src="./static/js/estoque.js"></script>
  </body>
</html>
