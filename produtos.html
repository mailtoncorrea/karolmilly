<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Produtos</title>
    <link rel="stylesheet" href="./static/css/produtos.css" />
  </head>
  <body>
    <div class="container">
      <h2>Cadastro de Produtos</h2>
      <input type="text" id="produtoNome" placeholder="Nome do Produto" />
      <input type="number" id="produtoPreco" placeholder="Preço" />
      <input type="number" id="quantidadeProduto" placeholder="Quantidade" />
      <button class="btn-add" onclick="adicionarProduto()">
        Adicionar Produto
      </button>

      <h2>Lista de Produtos</h2>
      <ul id="listaProdutos"></ul>

      <button onclick="window.location.href='vendas.html'">
        Ir para Vendas
      </button>
    </div>

    <script src="./static/js/produtos.js"></script>
  </body>
</html>
