<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatório de Transações - Karol Milly</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f8f8f8;
      }
      input,
      button {
        padding: 10px;
        margin: 5px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background-color: white;
      }
      th,
      td {
        padding: 10px;
        border: 1px solid #ccc;
        text-align: center;
      }
      th {
        background-color: #333;
        color: white;
      }
      #mensagem {
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div style="background-color: #2c3e50; padding: 15px; display: flex; align-items: center; justify-content: space-between;">
        <h1 style="color: #ecf0f1; margin: 0;">📊 Relatório de Transações</h1>
        <div style="display: flex; gap: 10px;">
          <button onclick="irParaVendas()" style="background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">
            🛍️ Vendas
          </button>
          <button onclick="irParaEstoque()" style="background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">
            📦 Estoque
          </button>
          <button onclick="logout()">Sair</button>
        </div>
      </div>
      
    <h2>Relatório de Transações</h2>

    <label for="nomeCliente">Digite o nome do cliente:</label>
    <input type="text" id="nomeCliente" placeholder="Ex: Maria da Silva" />
    <button onclick="buscarTransacoes()">Buscar</button>

    <div id="mensagem"></div>

    <table id="tabelaRelatorio" style="display: none">
      <thead>
        <tr>
          <th>Produto</th>
          <th>Quantidade</th>
          <th>Valor Total</th>
          <th>Valor Pago</th>
          <th>Deve</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>

    <script>
       function logout() {
        localStorage.removeItem("usuario_logado");
        window.location.href = "cadastro.html";
      }
    const usuario = localStorage.getItem("usuario_logado");
    if (!usuario) {
        alert("⚠️ Você precisa fazer login para acessar o sistema.");
        window.location.href = "cadastro.html";
    }

      async function buscarTransacoes() {
        const nome = document.getElementById("nomeCliente").value.trim();
        const mensagem = document.getElementById("mensagem");
        const tabela = document.getElementById("tabelaRelatorio");
        const corpoTabela = document.getElementById("corpoTabela");
        tabela.style.display = "none";
        mensagem.textContent = "";

        if (!nome) {
          mensagem.textContent = "Por favor, digite o nome do cliente.";
          return;
        }

        try {
          const response = await fetch(
            `http://192.168.18.14:5000/transacoes?nome=${encodeURIComponent(nome)}`
          );
          const dados = await response.json();

          if (response.status !== 200) {
            mensagem.textContent = dados.erro || "Erro ao buscar transações.";
            return;
          }

          if (dados.length === 0) {
            mensagem.textContent = "Nenhuma transação encontrada.";
            return;
          }

          corpoTabela.innerHTML = ""; // Limpa a tabela

          dados.forEach((transacao) => {
            const linha = document.createElement("tr");
            linha.innerHTML = `
            <td>${transacao.produto}</td>
            <td>${transacao.quantidade}</td>
            <td>R$ ${transacao.valor_total.toFixed(2)}</td>
            <td>R$ ${transacao.valor_pago.toFixed(2)}</td>
            <td>R$ ${transacao.deve.toFixed(2)}</td>
            <td>${transacao.data}</td>
          `;
            corpoTabela.appendChild(linha);
          });

          tabela.style.display = "table";
        } catch (error) {
          mensagem.textContent = "Erro ao buscar dados.";
          console.error(error);
        }
      }
      
  function irParaEstoque() {
    window.location.href = 'estoque.html';
  }
  function irParaVendas() {
    window.location.href = 'vendas.html';
  }
</script>

    </script>
  </body>
</html>
