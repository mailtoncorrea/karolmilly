<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Karol Milly - Login e Cadastro</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f1f1f1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        display: flex;
        gap: 50px;
      }
      .form {
        width: 250px;
      }
      .form h2 {
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #45a049;
      }
      .mensagem {
        font-size: 14px;
        margin-top: 10px;
      }
      .tabs {
        text-align: center;
        margin-bottom: 20px;
      }
      .tabs button {
        width: auto;
        margin: 0 5px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form">
        <div class="tabs">
          <button onclick="mostrarLogin()">Login</button>
          <button onclick="mostrarCadastro()">Cadastro</button>
        </div>

        <!-- Login -->
        <div id="loginFormContainer">
          <h2>Login</h2>
          <form id="loginForm">
            <input
              type="text"
              id="loginUsuario"
              placeholder="Usuário"
              required
            />
            <input
              type="password"
              id="loginSenha"
              placeholder="Senha"
              required
            />
            <button type="submit">Entrar</button>
          </form>
          <p id="loginMensagem" class="mensagem"></p>
        </div>

        <!-- Cadastro -->
        <div id="cadastroFormContainer" class="hidden">
          <h2>Cadastro</h2>
          <form id="cadastroForm">
            <input type="text" id="nome" placeholder="Nome completo" required />
            <input
              type="text"
              id="usuario"
              placeholder="Nome de usuário"
              required
            />
            <input
              type="password"
              id="senha"
              placeholder="Senha (mín. 6 caracteres)"
              required
            />
            <button type="submit">Cadastrar</button>
          </form>
          <p id="cadastroMensagem" class="mensagem"></p>
        </div>
      </div>
    </div>

    <script>
      function logout() {
        localStorage.removeItem("usuario_logado");
        window.location.href = "cadastro.html";
      }

      const loginForm = document.getElementById("loginForm");
      const cadastroForm = document.getElementById("cadastroForm");

      // Alternar entre login e cadastro
      function mostrarLogin() {
        document
          .getElementById("loginFormContainer")
          .classList.remove("hidden");
        document
          .getElementById("cadastroFormContainer")
          .classList.add("hidden");
      }

      function mostrarCadastro() {
        document
          .getElementById("cadastroFormContainer")
          .classList.remove("hidden");
        document.getElementById("loginFormContainer").classList.add("hidden");
      }

      // Login
      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        const usuario = document.getElementById("loginUsuario").value;
        const senha = document.getElementById("loginSenha").value;

        const resposta = await fetch("http://192.168.18.14:5000/api/login", {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, senha }),
        });

        const dados = await resposta.json();
        const mensagem = document.getElementById("loginMensagem");

        if (resposta.ok) {
          localStorage.setItem("usuario_logado", usuario);
          window.location.href = "vendas.html"; // Redireciona pro sistema
        } else {
          mensagem.style.color = "red";
          mensagem.textContent = dados.erro;
        }
      });

      // Cadastro
      cadastroForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const nome = document.getElementById("nome").value;
        const usuario = document.getElementById("usuario").value;
        const senha = document.getElementById("senha").value;
        const mensagem = document.getElementById("cadastroMensagem");

        if (senha.length < 6) {
          mensagem.style.color = "red";
          mensagem.textContent = "A senha deve ter no mínimo 6 caracteres.";
          return;
        }

        const resposta = await fetch(
          "http://192.168.18.14:5000/api/cadastrar",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome, usuario, senha }),
          }
        );

        const dados = await resposta.json();

        if (resposta.ok) {
          mensagem.style.color = "green";
          mensagem.textContent = "Cadastro realizado com sucesso!";
          cadastroForm.reset();
          setTimeout(() => {
            mostrarLogin();
            document.getElementById("loginMensagem").textContent =
              "Cadastro feito! Faça login.";
            document.getElementById("loginMensagem").style.color = "green";
          }, 1000);
        } else {
          mensagem.style.color = "red";
          mensagem.textContent = dados.erro || "Erro ao cadastrar.";
        }
      });
    </script>
  </body>
</html>
