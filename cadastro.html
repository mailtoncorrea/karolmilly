<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Karol Milly - Login e Cadastro</title>
    <link rel="stylesheet" href="static/css/cadastro.css" />
  </head>
  <body>
    <div class="container">
      <div class="form">
        <div class="tabs">
          <button onclick="mostrarLogin()">Login</button>
          <button onclick="mostrarCadastro()">Cadastro</button>
        </div>

        <!-- Login -->
        <div id="loginFormContainer">
          <h2>Login</h2>
          <form id="loginForm">
            <input
              type="text"
              id="loginUsuario"
              placeholder="Usuário"
              required
            />
            <input
              type="password"
              id="loginSenha"
              placeholder="Senha"
              required
            />
            <button type="submit">Entrar</button>
          </form>
          <p id="loginMensagem" class="mensagem"></p>
        </div>

        <!-- Cadastro -->
        <div id="cadastroFormContainer" class="hidden">
          <h2>Cadastro</h2>
          <form id="cadastroForm">
            <input type="text" id="nome" placeholder="Nome completo" required />
            <input
              type="text"
              id="usuario"
              placeholder="Nome de usuário"
              required
            />
            <input
              type="password"
              id="senha"
              placeholder="Senha (mín. 6 caracteres)"
              required
            />
            <button type="submit">Cadastrar</button>
          </form>
          <p id="cadastroMensagem" class="mensagem"></p>
        </div>
      </div>
    </div>

    <script src="./static/js/cadastro.js"></script>
  </body>
</html>
