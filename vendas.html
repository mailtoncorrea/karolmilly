<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <title>Gestão de Vendas - Karol Milly</title>
    <link rel="stylesheet" href="./static/css/vendas.css" />
  </head>

  <body>
    <header>
      <h1>🛍️ Gerenciador de Vendas</h1>
      <div class="top_buttons">
        <button onclick="irParaEstoque()">📦 Estoque</button>
        <button class="btn-green" onclick="irParaRelatorios()">
          📊 Relatórios
        </button>
        <button class="btn_logout" onclick="logout()">🚪 Sair</button>
      </div>
    </header>

    <main>
      <section>
        <h2>Cadastro de Clientes</h2>
        <input type="text" id="clienteNome" placeholder="Nome do Cliente" />
        <input type="text" id="telefone" placeholder="(99) 99999-9999" />
        <button class="btn-add" onclick="adicionarCliente()">
          ➕ Adicionar Cliente
        </button>
        <button class="btn-search" onclick="buscarCliente()">
          🔍 Buscar Cliente
        </button>

        <input
          type="number"
          id="valorPagamento"
          placeholder="Valor do Pagamento"
        />
        <button class="btn-add" onclick="realizarPagamento()">
          💰 Realizar Pagamento
        </button>
      </section>

      <section>
        <h2>Registrar Compra</h2>
        <input type="text" id="compraCliente" placeholder="Nome do Cliente" />
        <input type="text" id="compraProduto" placeholder="Nome do Produto" />
        <input type="number" id="compraQtd" placeholder="Quantidade" />
        <input type="number" id="valorPago" placeholder="Valor Pago" />
        <button class="btn-add" onclick="registrarCompra()">
          🧾 Registrar Compra
        </button>

        <h2>Histórico de Transações</h2>
        <input
          type="text"
          id="buscarTransacaoNome"
          placeholder="Nome do Cliente"
        />
        <button class="btn-search" onclick="buscarTransacoes()">
          🔍 Ver Transações
        </button>
        <ul id="transacaoLista"></ul>

        <button
          style="background-color: #3498db; color: white; margin-top: 15px"
          onclick="window.location.href='produtos.html'"
        >
          🛒 Ir para Produtos
        </button>
      </section>
    </main>

    <footer>Sistema Karol Milly © 2025 — Todos os direitos reservados</footer>

    <script src="./static/js/vendas.js"></script>
  </body>
</html>
